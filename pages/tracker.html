<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>MediMind | Health Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/medimind-v6.css?v=15">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="../assets/js/core/layout.js" defer></script>
    <script src="../assets/js/core/demo-data.js" defer></script>
    <script src="../assets/js/core/onboarding.js" defer></script>
    <script src="../assets/js/core/pwa.js" defer></script>
    <script src="../assets/js/core/app.js" defer></script>
    <script src="../assets/js/pages/tracker.js" defer></script>
</head>
<body data-page="tracker">
    <main class="main-content page">
        <div class="stack">
            <div class="page-header">
                <h1>Health Tracker</h1>
                <p>Log your steps and sleep for today.</p>
            </div>

            <div class="grid-2">
                <div class="card" style="display:flex;align-items:center;gap:20px;">
                    <div class="ring-wrap" style="width:120px;height:120px;flex-shrink:0;">
                        <svg viewBox="0 0 140 140" aria-hidden="true">
                            <circle cx="70" cy="70" r="60" fill="none" stroke="var(--border)" stroke-width="12"/>
                            <circle id="steps-ring" cx="70" cy="70" r="60" fill="none" stroke="var(--primary)" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 377" transform="rotate(-90 70 70)"/>
                        </svg>
                        <div class="ring-center">
                            <span id="steps-ring-pct" style="font-weight:700;font-size:18px;">0%</span>
                        </div>
                    </div>
                    <div>
                        <div class="caption">STEPS TODAY</div>
                        <div class="h2" style="margin-top:4px;"><output id="steps-output">0</output> <span class="caption">/ 10,000</span></div>
                    </div>
                </div>

                <div class="card">
                    <div class="caption">SLEEP LAST NIGHT</div>
                    <div class="h1" style="margin-top:8px;font-size:32px;"><output id="sleep-output">0</output> <span style="font-size:15px;font-weight:500;color:var(--text-muted);">hrs</span></div>
                    <span class="badge badge-success" style="margin-top:10px;">Log below to update</span>
                </div>
            </div>

            <div class="card">
                <span class="h2" style="font-size:16px;">Manual Entry</span>
                <div class="grid-2" style="margin-top:14px;">
                    <div class="input-group">
                        <label class="input-label" for="steps-input">Steps</label>
                        <input class="input" id="steps-input" type="number" min="0" placeholder="e.g. 7842">
                        <div class="progress-track" style="margin-top:10px;">
                            <div id="steps-progress" class="progress-fill" style="width:0%"></div>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label" for="sleep-input">Sleep (hours)</label>
                        <input class="input" id="sleep-input" type="number" min="0" max="24" step="0.1" placeholder="e.g. 7.2">
                    </div>
                </div>
            </div>

            <div class="card">
                <span class="h2" style="font-size:16px;">Today's Activity</span>
                <div style="height:220px;margin-top:12px;"><canvas id="tracker-chart" aria-label="Today's steps and sleep"></canvas></div>
            </div>
        </div>
    </main>
</body>
</html>
