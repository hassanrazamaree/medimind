<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>MediMind | Appointments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/medimind-v6.css">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="../assets/js/core/layout.js" defer></script>
    <script src="../assets/js/core/demo-data.js" defer></script>
    <script src="../assets/js/core/onboarding.js" defer></script>
    <script src="../assets/js/core/pwa.js" defer></script>
    <script src="../assets/js/core/app.js" defer></script>
    <script src="../assets/js/pages/appointments.js" defer></script>
</head>
<body data-page="appointments">
    <main class="main-content page">
        <div class="stack">
            <div class="page-header">
                <h1>Appointments</h1>
                <p>Doctor ki visits schedule karein aur manage karein.</p>
            </div>

            <div class="content-grid">
                <div class="stack">
                    <section class="card">
                        <div class="section-head"><h2>Upcoming</h2></div>
                        <div id="upcoming-list" class="item-list">
                            <div class="empty-state"><p>No upcoming appointments. Book one!</p></div>
                        </div>
                    </section>

                    <section class="card">
                        <div class="section-head"><h2>Past Appointments</h2></div>
                        <div id="past-list" class="item-list">
                            <div class="empty-state"><p>No past appointments yet.</p></div>
                        </div>
                    </section>
                </div>

                <div>
                    <section class="card">
                        <div class="section-head"><h2>Book New Appointment</h2></div>
                        <form id="book-form">
                            <div class="stack">
                                <div class="form-field">
                                    <label class="label" for="doctor-input">Doctor Name</label>
                                    <input id="doctor-input" class="input" type="text" placeholder="e.g. Dr. Ahmed" required>
                                </div>
                                <div class="form-field">
                                    <label class="label" for="specialty-input">Specialty</label>
                                    <select id="specialty-input" class="input" required>
                                        <option value="">Select specialty…</option>
                                        <option value="General Physician">General Physician</option>
                                        <option value="Cardiologist">Cardiologist</option>
                                        <option value="Dermatologist">Dermatologist</option>
                                        <option value="Neurologist">Neurologist</option>
                                        <option value="Orthopedic">Orthopedic</option>
                                        <option value="Gynecologist">Gynecologist</option>
                                        <option value="Dentist">Dentist</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label class="label" for="date-input">Date</label>
                                        <input id="date-input" class="input" type="date" required>
                                    </div>
                                    <div class="form-field">
                                        <label class="label" for="time-input">Time</label>
                                        <input id="time-input" class="input" type="time" required>
                                    </div>
                                </div>
                                <div class="form-field">
                                    <label class="label" for="reason-input">Reason / Notes</label>
                                    <textarea id="reason-input" class="input" rows="3" placeholder="Why are you seeing this doctor?"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">Book Appointment</button>
                            </div>
                        </form>
                        <div id="form-status" style="margin-top:12px;"></div>
                    </section>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
